title: '"Bondilectivo". Entre flores y recuerdos'
category: Cuadro por encargo
year: '2026'
intro: >-
  Un Bedford clásico reinterpretado a través de la tradición del fileteado
  porteño y la ornamentación del Art Nouveau.
description: >-
  Un Bedford clásico reinterpretado a través de la tradición del fileteado
  porteño y la ornamentación del Art Nouveau.
services:
  - Ilustración digital
  - Cuadro personalizado
cover:
  src: ../../assets/img/bondilectivo/cover.png
  alt: >-
    Una persona sostiene frente a una ventana el cuadro enmarcado con el
    colectivo ilustrado
blocks:
  - discriminant: hero
    value:
      image:
        src: ../../assets/img/bondilectivo/hero.jpg
        alt: >-
          Detalle del cuadro enmarcado: un colectivo clásico dentro de un marco
          ornamental con flores rojizas y una abeja
  - discriminant: text
    value:
      title: Descripción general
      body: >
        Pieza en blanco y negro realizada mediante ilustración digital y
        puntillismo, con detalles de sombra en rojo. La composición integra un
        colectivo clásico entre formas botánicas, flores y ornamentaciones que
        enmarcan la escena.
  - discriminant: images
    value:
      images:
        - src: ../../assets/img/bondilectivo/cover.png
          alt: >-
            Una persona sostiene frente a una ventana el cuadro enmarcado con el
            colectivo ilustrado
        - src: ../../assets/img/bondilectivo/detalle-1.png
          alt: >-
            Dibujando el colectivo en una tablet con un apple pencil, con una
            imagen de referencia en pantalla
  - discriminant: text
    value:
      title: Detrás de la ilustración
      body: >
        A partir de una fotografía de referencia y algunas indicaciones
        iniciales, se desarrolló la composición, buscando que el vehículo y los
        elementos naturales se fusionen armónicamente. El trabajo se completó
        con la impresión de la ilustración y la intervención del marco.
  - discriminant: image
    value:
      image:
        src: ../../assets/img/bondilectivo/cierre.png
        alt: >-
          Detalle de la ilustración impresa del colectivo con flores, una abeja
          y la firma «Sophia 2026»
