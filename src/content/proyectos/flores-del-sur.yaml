title: Flores del sur
category: Ilustración digital
year: '2025'
intro: >-
  Serie de ilustraciones botánicas a color, inspiradas en flores que llamaron mi
  atención durante el recorrido por la Patagonia Argentina.
description: >-
  Serie de ilustraciones botánicas a color, inspiradas en flores que llamaron mi
  atención durante el recorrido por la Patagonia Argentina.
services:
  - Ilustración botánica
  - Ilustración editorial
  - Ilustración digital
cover:
  src: ../../assets/img/flores-del-sur/cover.png
  alt: >-
    Ilustración de retama amarilla con el texto «Retama amarilla» en una tablet
    sobre una mesa de corte verde
blocks:
  - discriminant: images
    value:
      images:
        - src: ../../assets/img/flores-del-sur/retama-amarilla-q9bi.png
          alt: >-
            Ilustración de retama amarilla con el texto «Retama amarilla» en una
            tablet sobre una mesa de corte verde
        - src: ../../assets/img/flores-del-sur/hebe-purple-queen-o0n7.png
          alt: >-
            Ilustración de una hebe en proceso, con hojas coloreadas en violeta
            y rosa y flores aún sin color
  - discriminant: text
    value:
      title: Descripción general
      body: >
        Pequeña colección de ilustraciones individuales. Cada flor parte de la
        observación de sus formas y colores.
  - discriminant: images
    value:
      images:
        - src: ../../assets/img/flores-del-sur/photinia-nnkq.png
          alt: Flor photinia a color, sobre fondo blanco. La planta es a color
        - src: ../../assets/img/flores-del-sur/hebe-purple-queen-dnos.png
          alt: >-
            Ilustración terminada de Hebe Purple Queen, con hojas violetas y
            flores lilas sobre fondo blanco
  - discriminant: text
    value:
      title: Detrás de la ilustración
      body: >-
        Este proyecto fue también una oportunidad para probar nuevas formas de
        ilustrar digitalmente, incorporando el color y explorando otros recursos
        gráficos dentro de mi trabajo.
