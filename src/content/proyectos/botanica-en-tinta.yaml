title: Botánica en tinta
category: Ilustración tradicional
year: '2025'
intro: El punto como composición. Dos miradas diferentes sobre la naturaleza.
description: El punto como composición. Dos miradas diferentes sobre la naturaleza.
services:
  - Ilustración personalizada
  - Puntillismo
  - Arte botánico
cover:
  src: ../../assets/img/botanica-en-tinta/cover.png
  alt: >-
    Ilustración en tinta con puntillismo de un ramo de flores, firmada Sophia
    2025, sobre un paspartú verde
blocks:
  - discriminant: hero
    value:
      image:
        src: ../../assets/img/botanica-en-tinta/hero.jpg
        alt: Detalle de una ilustración en tinta de hongos, hierbas y estrellas
  - discriminant: text
    value:
      title: Descripción general
      body: >
        Piezas únicas realizadas a mano en blanco y negro, utilizando el
        puntillismo como recurso para construir texturas y contrastes.
  - discriminant: images
    value:
      images:
        - src: ../../assets/img/botanica-en-tinta/cover.png
          alt: >-
            Ilustración en tinta con puntillismo de un ramo de flores, firmada
            Sophia 2025, sobre un paspartú verde
        - src: ../../assets/img/botanica-en-tinta/detalle-1.png
          alt: >-
            Una persona sostiene enmarcada su ilustración en tinta de hongos que
            crecen sobre un cráneo
  - discriminant: text
    value:
      title: Detrás de la ilustración
      body: >
        Dos ilustraciones que exploran distintas formas de representar la
        naturaleza.


        Una combina flores, plantas y bichitos con una calavera como centro de
        la escena, creando un contraste entre lo vivo y lo muerto. La otra,
        reúne flores nativas características de la Patagonia Argentina.
  - discriminant: image
    value:
      image:
        src: ../../assets/img/botanica-en-tinta/cierre.png
        alt: Mano dibujando con un fineliner una flor puntillista en tinta
