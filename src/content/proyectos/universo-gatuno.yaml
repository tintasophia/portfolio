title: Universo gatuno
category: Personajes
year: 2024 - 2026
intro: >-
  Colección de ilustraciones de gatos que explora diferentes estilos, técnicas y
  formas.
description: >-
  Colección de ilustraciones de gatos que explora diferentes estilos, técnicas y
  formas de representación.
services:
  - Ilustración digital
  - Ilustración editorial
  - Diseño de personajes
cover:
  src: ../../assets/img/universo-gatuno/cover.png
  alt: >-
    Carta de tarot «The Skater»: un gato celeste asomado de un patín en línea
    entre nubes y estrellas
blocks:
  - discriminant: text
    value:
      title: Descripción general
      body: >
        Una selección de ilustraciones de distintos personajes felinos,
        realizadas tanto en formato digital como tradicional. Cada uno tiene sus
        propias particularidades, con propuestas que van desde lo cute y
        caricaturesco hasta algo más trash.
  - discriminant: images
    value:
      images:
        - src: ../../assets/img/universo-gatuno/cover.png
          alt: >-
            Carta de tarot «The Skater»: un gato celeste asomado de un patín en
            línea entre nubes y estrellas
        - src: ../../assets/img/universo-gatuno/detalle-1.png
          alt: >-
            Dibujo en blanco y negro de un gato esqueleto cayendo en un remolino
            de huesos, espinas de pescado y estrellas
  - discriminant: text
    value:
      title: Detrás de la ilustración
      body: >
        Este conjunto reúne diferentes exploraciones personales en torno a un
        mismo tema. A través de distintas técnicas y estilos, busqué jugar con
        las formas, exagerar ciertos rasgos y darles personalidad propia a cada
        uno de los gatos.
  - discriminant: images
    value:
      images:
        - src: ../../assets/img/universo-gatuno/fullsizerender-nlwk.jpeg
          alt: >-
            Cuaderno abierto con garabatos de gatos, un hámster punk, calaveras
            y manos con el gesto del rock, rodeado de fineliners
        - src: ../../assets/img/universo-gatuno/img-0601-6yra.png
          alt: >-
            Ilustración de gato acostado con la barriga para arriba. Blanco y
            negro sobre fondo blanco
