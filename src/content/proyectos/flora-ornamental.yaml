title: Flora ornamental
category: Ilustración digital
year: 2023 - 2026
intro: >-
  Selección de ilustraciones digitales de flores, trabajadas con puntillismo,
  sombras y texturas.
description: >-
  Selección de ilustraciones digitales de flores, trabajadas con puntillismo,
  sombras y texturas.
services:
  - Ilustración botánica
  - Ilustración editorial
  - Ilustración personalizada
cover:
  src: ../../assets/img/flora-ornamental/cover.png
  alt: >-
    Rosa con hojas y espinas sobre un corazón agrietado, en blanco y negro con
    puntillismo
blocks:
  - discriminant: hero
    value:
      image:
        src: ../../assets/img/flora-ornamental/hero.png
        alt: >-
          Flor blanca con largos estambres rojos dentro de un marco ornamental
          con grietas, en blanco y negro
  - discriminant: text
    value:
      title: Descripción general
      body: >
        Una selección de ilustraciones independientes que tienen a las flores
        como protagonistas. Cada pieza presenta una composición propia,
        trabajada a través del puntillismo, las sombras y las texturas de
        líneas, con pequeños detalles que aportan un carácter particular a cada
        ilustración.
  - discriminant: images
    value:
      images:
        - src: ../../assets/img/flora-ornamental/cover.png
          alt: >-
            Rosa con hojas y espinas sobre un corazón agrietado, en blanco y
            negro con puntillismo
        - src: ../../assets/img/flora-ornamental/detalle-1.png
          alt: >-
            Flor con capullo, hojas, telarañas, una araña pequeña y destellos,
            en escala de grises
  - discriminant: text
    value:
      title: Detrás de la ilustración
      body: >
        Un proyecto personal que surgió de mi interés por aprender más sobre la
        anatomía de las flores, explorar sus formas y sumar detalles inesperados
        a cada composición.
  - discriminant: image
    value:
      image:
        src: ../../assets/img/flora-ornamental/cierre.png
        alt: >-
          Rama con flores y hojas rayadas, una abeja y finas telarañas, en
          blanco y negro
