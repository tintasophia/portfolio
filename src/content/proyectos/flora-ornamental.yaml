title: Flora ornamental
category: Ilustración digital
year: 2024 - 2026
intro: >-
  Selección de ilustraciones digitales de flores, trabajadas con puntillismo,
  sombras y texturas.
description: >-
  Selección de ilustraciones digitales de flores, trabajadas con puntillismo,
  sombras y texturas.
services:
  - Ilustración botánica
  - Ilustración editorial
  - Ilustración personalizada
cover:
  src: ../../assets/img/flora-ornamental/cover.png
  alt: >-
    Rosa con hojas y espinas sobre un corazón agrietado, en blanco y negro con
    puntillismo
blocks:
  - discriminant: text
    value:
      title: Descripción general
      body: >
        Selección de ilustraciones independientes que tienen a las flores y
        plantas como protagonistas. Cada pieza trabajada a través del
        puntillismo, con pequeños detalles que aportan un carácter particular a
        cada ilustración.
  - discriminant: images
    value:
      images:
        - src: ../../assets/img/flora-ornamental/cover.png
          alt: >-
            Rosa con hojas y espinas sobre un corazón agrietado, en blanco y
            negro con puntillismo
        - src: ../../assets/img/flora-ornamental/detalle-1.png
          alt: >-
            Flor con capullo, hojas, telarañas, una araña pequeña y destellos,
            en escala de grises
  - discriminant: text
    value:
      title: Detrás de la ilustración
      body: >
        Proyecto personal que surge del interés por aprender más sobre la
        anatomía de las plantas.
  - discriminant: images
    value:
      images:
        - src: ../../assets/img/flora-ornamental/img-1400-z0d2.png
          alt: aa
        - src: ../../assets/img/flora-ornamental/img-0455-zjan.png
          alt: asd
