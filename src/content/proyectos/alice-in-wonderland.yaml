title: Alice in Wonderland. Portada de libro
category: Editorial
year: '2026'
intro: >-
  Reinterpretación ilustrada del clásico de Lewis Carroll, Alicia en el país de
  las maravillas.
description: >-
  Reinterpretación ilustrada del clásico de Lewis Carroll, Alicia en el país de
  las maravillas.
services:
  - Ilustración editorial
  - Ilustración digital
  - Diseño de portada
cover:
  src: ../../assets/img/alice-in-wonderland/cover.jpg
  alt: >-
    Dibujando en una tablet la portada de Alice in Wonderland: tazas apiladas
    sobre un fondo violeta
blocks:
  - discriminant: hero
    value:
      image:
        src: ../../assets/img/alice-in-wonderland/hero.png
        alt: >-
          Libro de tapa dura «Alice in Wonderland» con una portada violeta que
          muestra una pila de tazas con la sonrisa del Gato de Cheshire
  - discriminant: text
    value:
      title: Descripción general
      body: >
        Reinterpretación visual de Alicia en el país de las maravillas,
        explorando su universo fantástico desde una mirada más oscura y
        misteriosa. La propuesta combina elementos del imaginario gótico con una
        estética de fantasía sombría, buscando darle una nueva personalidad
        visual a esta historia clásica.
  - discriminant: images
    value:
      images:
        - src: ../../assets/img/alice-in-wonderland/cover.jpg
          alt: >-
            Dibujando en una tablet la portada de Alice in Wonderland: tazas
            apiladas sobre un fondo violeta
        - src: ../../assets/img/alice-in-wonderland/detalle-1.jpg
          alt: >-
            Detalle del dibujo en la tablet: la taza roja con corazones y
            tablero de ajedrez, con el lápiz sobre la pantalla
  - discriminant: text
    value:
      title: Detrás de la ilustración
      body: >
        El desafío fue encontrar una forma de representar el universo de la
        historia sin recurrir a sus representaciones más convencionales. La
        propuesta toma pequeños elementos reconocibles del relato y los
        transforma en parte de una composición con identidad propia.
  - discriminant: image
    value:
      image:
        src: ../../assets/img/alice-in-wonderland/cierre.png
        alt: >-
          Dos ejemplares del libro con la portada ilustrada de Alice in
          Wonderland sobre una mesa de madera
