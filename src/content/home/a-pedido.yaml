eyebrow: A pedido
title: ¿Tenés una idea en mente?
subtitle: Siempre hay lugar para nuevas propuestas!
intro: >-
  Disfruto explorar distintas temáticas y formas de ilustrar. Me gusta
  especialmente combinar lo delicado y oscuro, jugando con contrastes que le dan
  a cada pieza una personalidad propia.
groups:
  - title: ¿Qué podemos hacer?
    items:
      - Ilustraciones personalizadas
      - Ilustración botánica y floral
      - Ilustración de personajes
      - Composiciones temáticas
  - title: ¿Dónde pueden aplicarse?
    items: []
    text: >-
      Las ilustraciones pueden adaptarse a diferentes formatos y soportes, como
      libros, cuadernos, láminas, cuadros, flyers y portadas. Si tenés otra idea
      en mente, podemos charlarla y ver cómo llevarla a cabo.

      Estoy abierta a nuevas propuestas!
note: >-
  Trabajo principalmente en formato digital, con posibilidad de imprimir las
  ilustraciones.
contactTitle: ¿Arrancamos? Escribime y lo charlamos.
